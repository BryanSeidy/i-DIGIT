name: Validate site build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/integrateur-technologique-positioning]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
